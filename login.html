<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to the ESCi member portal">
  <title>Login - ESCi Member Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-left-content">
        <a href="index.html"><img src="assets/images/logo.svg" alt="ESCi"></a>
        <h2>Member Portal</h2>
        <p>Access your membership dashboard, CME credits, event registrations, scientific library, and digital membership card.</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-header">
        <h1>Welcome Back</h1>
        <p>Don't have an account? <a href="register.html">Apply for Membership</a></p>
      </div>

      <form id="loginForm" class="auth-form" action="admin/index.html" method="get">
        <div class="form-group-esci">
          <label for="email">Email Address</label>
          <div class="input-icon-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" name="email" placeholder="doctor@hospital.eg" required autocomplete="username">
          </div>
        </div>

        <div class="form-group-esci">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <div class="form-options">
          <div class="form-check-esci">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-esci btn-esci-red btn-auth-submit">Sign In</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> Back to Homepage</a>
    </div>
  </div>

  <script src="assets/js/jquery.min.js"></script>
  <script>
    $('#loginForm').on('submit', function (e) {
      e.preventDefault();
      window.location.href = 'admin/index.html';
    });
  </script>
</body>
</html>
