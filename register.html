<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Membership - ESCi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/images/logo.svg" alt="ESCi">
        <h2>Join ESCi</h2>
        <p>Apply for membership and become part of Egypt's leading interventional cardiology community. Access exclusive resources, events, and networking opportunities.</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-header">
        <h1>Membership Application</h1>
        <p>Already a member? <a href="login.html">Sign In</a></p>
      </div>

      <form id="registerForm">
        <div class="form-group-esci">
          <label for="fullName">Full Name</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="fullName" placeholder="Dr. Ahmed Hassan" required>
          </div>
        </div>

        <div class="form-group-esci">
          <label for="email">Email Address</label>
          <div class="input-icon-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" placeholder="doctor@hospital.eg" required>
          </div>
        </div>

        <div class="form-group-esci">
          <label for="specialty">Specialty</label>
          <select id="specialty" required>
            <option value="">Select specialty</option>
            <option>Interventional Cardiology</option>
            <option>Structural Heart</option>
            <option>Electrophysiology</option>
            <option>General Cardiology</option>
            <option>Cardiac Surgery</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group-esci">
          <label for="hospital">Hospital / Institution</label>
          <div class="input-icon-wrap">
            <i class="bi bi-building"></i>
            <input type="text" id="hospital" placeholder="Cairo University Hospital" required>
          </div>
        </div>

        <div class="form-group-esci">
          <label for="phone">Phone Number</label>
          <div class="input-icon-wrap">
            <i class="bi bi-telephone"></i>
            <input type="tel" id="phone" placeholder="+20 1XX XXX XXXX" required>
          </div>
        </div>

        <div class="form-group-esci">
          <label for="password">Create Password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" placeholder="Minimum 8 characters" required>
          </div>
        </div>

        <div class="form-check-esci" style="margin-bottom:24px;">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the ESCi membership terms and bylaws</label>
        </div>

        <button type="submit" class="btn-esci btn-esci-red btn-auth-submit">Submit Application</button>
      </form>

      <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> Back to Homepage</a>
    </div>
  </div>

  <script src="assets/js/jquery.min.js"></script>
  <script>
    $('#registerForm').on('submit', function (e) {
      e.preventDefault();
      alert('Your membership application has been submitted successfully. You will receive a confirmation email once reviewed by the admin team.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
